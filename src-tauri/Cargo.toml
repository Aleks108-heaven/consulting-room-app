[package]
name = "consulting-room"
version = "1.0.0"
description = "Consulting Room — a study companion for the history of psychotherapy"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "consulting_room_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
